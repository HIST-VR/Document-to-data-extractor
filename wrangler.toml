name = "doclens-ua"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-12"
compatibility_flags = ["nodejs_compat"]

# wrangler kv namespace create DOC_LENS_USAGE
# wrangler kv namespace create DOC_LENS_USAGE --preview
[[kv_namespaces]]
binding = "USAGE_KV"
id = "807d0536245c4fb0b9ac82985ada6f5e"
preview_id = "f79850fcadab4b26bf66be43fb98f55e"

# Pages does not support the Workers rate-limit binding.
# The Function counts 6 requests per 60 seconds per IP in USAGE_KV instead.

[vars]
GEMINI_MODEL = "gemini-3.5-flash-lite"
GEMINI_DATA_TERMS = "free"
DAILY_CAP = "100"
# Public site key for the DocLens UA widget. Host: doclens-ua.pages.dev.
TURNSTILE_SITE_KEY = "0x4AAAAAAFYovw18MVPNiJnr"
